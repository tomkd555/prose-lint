StylesPath = styles
MinAlertLevel = suggestion

# proselint: editorial checks (clichés, redundancy, corporate speak, jargon,
# hedging).
# ai-tells (https://github.com/tbhb/vale-ai-tells, MIT): the signs of
# LLM-written English - overused vocabulary, stock openers and closings,
# hedges, vague attributions, participial padding, copula dodges, transitions,
# figurative verbs, em dashes. Every one of its rules is level error; the
# skill sorts them into fixed and advisory by the message's family.
# AISigns (styles/AISigns, shipped with the skill): three house rules for what
# ai-tells leaves out - the model talking about itself and pasted chat
# tokens, emoji in headings or list items, and five or more commas in one
# sentence.
Packages = proselint, ai-tells

[*.{md,html,htm,txt}]
BasedOnStyles = proselint, ai-tells, AISigns

# A word typed twice in a row ("the the").
Vale.Repetition = YES

# "very" and a paragraph opening on "But" are ordinary English; on the Go
# blog and the Rust book these fired on sound sentences only.
proselint.Very = NO
proselint.But = NO

# Typography symbols and TODO markers fall outside wording.
proselint.Typography = NO
proselint.Annotations = NO

# ai-tells rules that police one project's own house wording; they do not
# say anything about whether a human wrote the text.
ai-tells.HouseStyle = NO
ai-tells.ShipOveruse = NO

# ai-tells rules that fired more often on human-written technical prose (six
# Go blog posts and five Rust book chapters, 18,000 words) than on
# LLM-written articles on the same topics, and whose hits there were sound
# sentences: "For example" and "Therefore", "implements" as a term of art,
# a capital after a colon, "particular" and "certain", "can hold any value",
# "In other words", "This means", "of course", italic "not", and "a single
# channel".
ai-tells.FormalTransitions = NO
ai-tells.FormalRegister = NO
ai-tells.ColonUsage = NO
ai-tells.EmptyPadding = NO
ai-tells.EmptyPaddingStacked = NO
ai-tells.BareHolds = NO
ai-tells.RestatementMarkers = NO
ai-tells.Metacommentary = NO
ai-tells.SycophancyMarkers = NO
ai-tells.EmphaticCopula = NO
ai-tells.FillerIntensifier = NO
