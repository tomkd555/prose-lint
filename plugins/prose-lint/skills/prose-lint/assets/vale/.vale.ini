StylesPath = styles
MinAlertLevel = warning

Packages = proselint

# proselint only. write-good already runs through textlint on the same files
# (textlint/.textlintrc.en.json), so adding it here would double-report.
# proselint covers what textlint has no rule for: redundancy, pretension,
# jargon, hedging.
[*.{md,html,htm,txt}]
BasedOnStyles = proselint

# Duplicates write-good's cliché and "very" checks in textlint.
proselint.Cliches = NO
proselint.Very = NO

# Typography symbols and TODO markers fall outside wording.
proselint.Typography = NO
proselint.Annotations = NO
